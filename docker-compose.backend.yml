services:
  api:
    build:
      context: .
      dockerfile: apps/web/backend-api/Dockerfile
    container_name: fluxsql-backend-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000,https://*.vercel.app}
      DATABASE_URL: postgres://fluxsql:${POSTGRES_PASSWORD:-fluxsql_password}@postgres:5432/fluxsql
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: fluxsql-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluxsql
      POSTGRES_USER: fluxsql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluxsql_password}
    volumes:
      - fluxsql_postgres_data:/var/lib/postgresql/data
      - ./apps/web/backend-api/src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxsql -d fluxsql"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fluxsql_postgres_data:
