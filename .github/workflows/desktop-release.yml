name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example desktop-v0.1.1"
        required: true
        default: "desktop-v0.1.0"
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply release version
        shell: powershell
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag -replace '^desktop-v', ''

          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must look like desktop-v0.1.0. Received: $tag"
          }

          $packagePath = "apps/desktop/frontend-app/package.json"
          $packageJson = Get-Content $packagePath -Raw | ConvertFrom-Json
          $packageJson.version = $version
          $packageJson | ConvertTo-Json -Depth 20 | Set-Content $packagePath -Encoding utf8

          $tauriConfigPath = "apps/desktop/frontend-app/src-tauri/tauri.conf.json"
          $tauriConfig = Get-Content $tauriConfigPath -Raw | ConvertFrom-Json
          $tauriConfig.version = $version
          $tauriConfig | ConvertTo-Json -Depth 20 | Set-Content $tauriConfigPath -Encoding utf8

          $cargoPath = "apps/desktop/frontend-app/src-tauri/Cargo.toml"
          $cargoToml = Get-Content $cargoPath -Raw
          $cargoToml = $cargoToml -replace '(?m)^version = ".*"$', "version = `"$version`""
          Set-Content $cargoPath $cargoToml -Encoding utf8

          "Desktop release version: $version"

      - name: Build desktop installer
        run: pnpm --filter @fluxsql/desktop desktop:build

      - name: Locate installer
        id: installer
        shell: powershell
        run: |
          $asset = Get-ChildItem "apps/desktop/frontend-app/src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $asset) {
            throw "No NSIS setup.exe installer was generated."
          }

          "path=$($asset.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($asset.Name)" >> $env:GITHUB_OUTPUT
          "Located installer: $($asset.FullName)"

      - name: Calculate checksum
        id: checksum
        shell: powershell
        run: |
          $asset = "${{ steps.installer.outputs.path }}"
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "${{ steps.installer.outputs.name }} SHA256: $hash" | Out-File -FilePath desktop-checksums.txt -Encoding utf8
          @"
          FluxSQL Desktop ${{ github.event.inputs.tag || github.ref_name }}

          Windows installer:
          - ${{ steps.installer.outputs.name }}

          SHA256:
          - $hash
          "@ | Out-File -FilePath desktop-release-notes.txt -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.installer.outputs.name }}
          path: ${{ steps.installer.outputs.path }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: FluxSQL Desktop ${{ github.event.inputs.tag || github.ref_name }}
          body_path: desktop-release-notes.txt
          files: |
            ${{ steps.installer.outputs.path }}
            desktop-checksums.txt
