name: Publish VS Code Extension to Open VSX

on:
  workflow_dispatch:
  push:
    tags:
      - "vscode-v*"

permissions:
  contents: write

jobs:
  publish:
    name: Package and publish VSIX
    runs-on: ubuntu-latest
    env:
      OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test extension
        run: pnpm --filter ./apps/vscode-extension test

      - name: Package extension
        run: pnpm run package:vscode-extension

      - name: Ensure Open VSX namespace
        if: ${{ env.OPEN_VSX_TOKEN != '' }}
        run: pnpm dlx ovsx create-namespace JeffersonVargas -p "$OPEN_VSX_TOKEN" || true

      - name: Publish to Open VSX Registry
        if: ${{ env.OPEN_VSX_TOKEN != '' }}
        run: pnpm dlx ovsx publish apps/vscode-extension/*.vsix -p "$OPEN_VSX_TOKEN"

      - name: Calculate VSIX checksum
        run: sha256sum apps/vscode-extension/*.vsix > vscode-extension-checksums.txt

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: FluxSQL VS Code Extension ${{ github.ref_name }}
          body: |
            FluxSQL VS Code extension package.

            Includes:
            - VSIX package
            - SHA256 checksum
            - Open VSX publishing workflow
          files: |
            apps/vscode-extension/*.vsix
            vscode-extension-checksums.txt
