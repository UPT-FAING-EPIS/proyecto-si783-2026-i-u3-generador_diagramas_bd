name: Publish FluxSQL Skill to NPM and GPR

on:
  push:
    branches:
      - main
    paths:
      - '.agents/skills/fluxsql-workbench/**'

permissions:
  contents: read
  packages: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js para NPM
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publicar en NPM
        working-directory: .agents/skills/fluxsql-workbench
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-gpr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js para GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@UPT-FAING-EPIS'

      - name: Renombrar y Publicar en GitHub Packages
        working-directory: .agents/skills/fluxsql-workbench
        run: |
          npm pkg set name="@UPT-FAING-EPIS/fluxsql-skill"
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
