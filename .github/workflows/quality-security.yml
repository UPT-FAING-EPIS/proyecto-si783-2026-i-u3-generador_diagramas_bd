name: Quality and Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build-test:
    name: Build and focused tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm run build:api

      - name: Build web
        run: pnpm run build:web
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgres://fluxsql:fluxsql@127.0.0.1:5432/fluxsql' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build VS Code extension
        run: pnpm run build:vscode-extension

      - name: Test VS Code extension parser
        run: pnpm --filter ./apps/vscode-extension test

      - name: Package Codex skill dry run
        run: pnpm run package:codex-skill

      - name: Audit npm dependencies
        run: pnpm audit --audit-level moderate
        continue-on-error: true

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/secrets
            p/typescript
            p/javascript
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  snyk:
    name: Snyk dependency scan
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        if: ${{ env.SNYK_TOKEN != '' }}
        run: pnpm install --frozen-lockfile

      - name: Run Snyk
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        with:
          command: test
          args: --all-projects --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  sonar:
    name: Sonar scan
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube/SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
