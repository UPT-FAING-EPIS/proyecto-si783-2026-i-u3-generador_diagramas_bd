name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fluxsql-vps-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to No-IP VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            REPO_URL="https://github.com/UPT-FAING-EPIS/proyecto-si783-2026-i-u3-generador_diagramas_bd.git"

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is required on the VPS before deployment."
              exit 1
            fi

            mkdir -p "$APP_DIR"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            cat > .env <<'FLUXSQL_ENV'
            ${{ secrets.PRODUCTION_ENV }}
            FLUXSQL_ENV

            docker compose -f docker-compose.prod.yml config
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker compose -f docker-compose.prod.yml ps
